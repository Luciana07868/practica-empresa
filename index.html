<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Práctica con Tailwind CSS</title>
  <link href="https://unpkg.com/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 font-sans">

  <nav class="flex justify-between items-center bg-gray-800 text-white px-8 py-4 shadow">
    <strong class="text-lg tracking-wide">MiPortafolio</strong>
    <ul class="flex gap-6 text-sm">
      <li class="hover:text-blue-400 cursor-pointer">Inicio</li>
      <li class="hover:text-blue-400 cursor-pointer">Proyectos</li>
      <li class="hover:text-blue-400 cursor-pointer">Contacto</li>
    </ul>
  </nav>

  <main class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 p-8">
    <div class="bg-white p-6 rounded-xl shadow hover:shadow-lg transition">
      <h3 class="font-bold text-gray-800 text-lg mb-2">Proyecto 1</h3>
      <p class="text-gray-600 text-sm">Sistema con Git y Terminal</p>
    </div>
    <div class="bg-white p-6 rounded-xl shadow hover:shadow-lg transition">
      <h3 class="font-bold text-gray-800 text-lg mb-2">Proyecto 2</h3>
      <p class="text-gray-600 text-sm">Maquetación con Tailwind</p>
    </div>
    <div class="bg-white p-6 rounded-xl shadow hover:shadow-lg transition">
      <h3 class="font-bold text-gray-800 text-lg mb-2">Proyecto 3</h3>
      <p class="text-gray-600 text-sm">Consumo de Web APIs</p>
    </div>
    <div class="bg-white p-6 rounded-xl shadow hover:shadow-lg transition">
      <h3 class="font-bold text-gray-800 text-lg mb-2">Proyecto 4</h3>
      <p class="text-gray-600 text-sm">App en React</p>
    </div>
  </main>

</body>
</html>
